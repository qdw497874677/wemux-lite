  <style>

l{overflow:auto;height:calc(100% - 45px);padding:9px}.section-label{font-size:10px;color:#677186;text-transform:uppercase;letter-spacing:.08em;padding:8px 7px 5px}.item{padding:9px 9px;border-radius:6px;display:flex;gap:9px;align-items:center;color:#bac2d1;cursor:pointer;border:1px solid transparent;margin-bottom:2px}.item:hover{background:#171b24}.item.active{background:#1a2131;border-color:#2c3c61;color:#f0f4ff}.item-main{min-width:0;flex:1}.item-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}.item-meta{font-size:10px;color:var(--muted);margin-top:3px}.dot{width:7px;height:7px;border-radius:50%;background:#677186;flex:none}.dot.on{background:var(--green);box-shadow:0 0 0 3px #55d69217}.dot.busy{background:var(--yellow)}.pill{font-size:10px;padding:2px 6px;border-radius:99px;background:#202634;color:#aab4c6;white-space:nowrap}.pill.blue{background:#202b49;color:#aabfff}.pill.green{background:#163326;color:#7be1ab}.pill.yellow{background:#352915;color:#e9c274}.chat{height:100%;display:flex;flex-direction:column;background:#0e1117}.chat-head{height:56px;border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;gap:10px}.chat-title{font-weight:650}.chat-meta{color:var(--muted);font-size:10px;margin-top:3px}.messages{flex:1;overflow:auto;padding:22px max(20px,calc((100% - 760px)/2))}.message{display:flex;gap:11px;margin:0 0 22px}.message.user{justify-content:flex-end}.bubble{max-width:82%;line-height:1.6}.user .bubble{background:#25365c;padding:9px 12px;border-radius:9px 9px 2px 9px}.agent-icon{width:25px;height:25px;flex:none;border-radius:6px;background:#28233d;color:#c8b9ff;display:grid;place-items:center;font-size:11px}.agent-text p{margin:0 0 8px}.tool{border:1px solid var(--line);background:#121720;border-radius:6px;padding:9px 10px;margin:8px 0;color:#aeb7c6}.tool code{color:#d9e1ef}.composer-wrap{padding:10px max(15px,calc((100% - 780px)/2)) 14px}.composer{border:1px solid #303847;background:#151a22;border-radius:9px;padding:10px}.composer textarea{width:100%;height:44px;resize:none;background:transparent;border:0;outline:0;color:var(--text)}.compose-row{display:flex;align-items:center;gap:7px}.select-mini{background:#0f131a;color:#b8c0cf;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:10px}.send{margin-left:auto;border:0;border-radius:6px;background:var(--blue);color:white;padding:7px 12px;cursor:pointer}.detail{padding:12px}.card{border:1px solid var(--line);background:#12161e;border-radius:7px;padding:11px;margin-bottom:9px}.card h3{font-size:11px;margin:0 0 9px;color:#cdd5e4}.kv{display:grid;grid-template-columns:70px 1fr;gap:7px;font-size:11px;margin:7px 0}.kv span:first-child{color:var(--muted)}.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#c8d2e3;background:#0b0e13;padding:7px;border-radius:4px;word-break:break-all}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #202530}.stat:last-child{border:0}.worker-grid{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:12px;overflow:auto}.worker{border:1px solid var(--line);background:#12161e;border-radius:8px;overflow:hidden}.worker-top{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.worker-body{padding:11px}.runtime{padding:9px;border:1px solid #252b38;border-radius:6px;margin-bottom:7px}.runtime-row{display:flex;align-items:center;gap:7px}.models{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.mini-model{font-size:9px;color:#aeb9cc;background:#1c2230;padding:3px 6px;border-radius:4px}.hero-chat{max-width:900px;margin:0 auto;height:100%;display:flex;flex-direction:column}.session-strip{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:7px;overflow:auto}.session-chip{white-space:nowrap;border:1px solid var(--line);background:#141820;color:#aeb6c5;border-radius:6px;padding:7px 9px}.session-chip.active{border-color:#516cae;color:white;background:#1d2942}.switcher{position:fixed;z-index:20;bottom:17px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;background:#f5f7fb;color:#161a22;border-radius:9px;box-shadow:0 8px 35px #000a}.switcher button{border:0;background:transparent;padding:7px 10px;border-radius:5px;cursor:pointer;color:#373e4b}.switcher button:hover{background:#e3e7ef}.switcher .label{font-weight:650;min-width:200px;text-align:center;font-size:12px}.note{position:fixed;right:14px;bottom:16px;color:#6f788b;font-size:10px}.empty{height:100%;display:grid;place-items:center;color:var(--muted)}
    .variant-a{grid-template-columns:245px 1fr 270px}.variant-b{grid-template-columns:185px 1fr}.variant-c{grid-template-columns:205px 1fr}.node-main{height:100%;display:flex;flex-direction:column;background:#0e1117}.node-toolbar{height:57px;padding:0 15px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:9px}.node-toolbar h2{font-size:14px;margin:0}.primary{border:0;background:var(--blue);color:white;border-radius:6px;padding:7px 10px;cursor:pointer}.danger{border:1px solid #65323b;background:#28171c;color:#ff9aa2;border-radius:6px;padding:7px 10px;cursor:pointer}.project-tools{display:flex;gap:5px;padding:5px 7px 9px}.project-tools button{flex:1}.binding{border:1px solid var(--line);border-radius:6px;padding:8px;margin:0 0 6px;background:#10141b}.binding-top{display:flex;align-items:center;gap:7px}.binding .path{margin-top:6px}.binding.offline{opacity:.62}.banner{margin:12px max(20px,calc((100% - 760px)/2)) 0;border:1px solid #5e4824;background:#251e13;color:#edc976;border-radius:7px;padding:9px 11px;display:flex;gap:9px;align-items:center}.locked-runtime{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:10px}.modal-backdrop{position:fixed;inset:0;z-index:30;background:#000a;display:grid;place-items:center;padding:18px}.modal{width:min(620px,96vw);max-height:88vh;overflow:auto;background:#12161e;border:1px solid #343c4c;border-radius:10px;box-shadow:0 24px 80px #000;padding:17px}.modal-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}.modal h2{font-size:16px;margin:0 0 4px}.modal-step{font-size:10px;color:#71809a}.form-label{display:block;color:#aab4c6;font-size:11px;margin:12px 0 6px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#0e1218;color:var(--text);border-radius:7px;padding:10px;text-align:left;cursor:pointer}.choice.selected{border-color:#617fca;background:#19233a}.choice[disabled]{opacity:.45;cursor:not-allowed}.choice-title{display:flex;gap:7px;align-items:center;font-weight:600}.choice-meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.4}.full-select{width:100%;background:#0e1218;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}.table{margin:14px;border:1px solid var(--line);border-radius:7px;overflow:hidden}.tr{display:grid;grid-template-columns:1.1fr .8fr 1fr .9fr 80px;align-items:center;min-height:48px;padding:0 12px;border-bottom:1px solid var(--line)}.tr:last-child{border:0}.tr.header{min-height:35px;background:#141821;color:#768096;font-size:10px}.runtime-name{display:flex;gap:8px;align-items:center}.mobile-warning{display:none}@media(max-width:920px){.right{display:none}.variant-a{grid-template-columns:220px 1fr}.worker-grid{grid-template-columns:1fr}.search{display:none}.note{display:none}}@media(max-width:560px){.left{display:none}.variant-a,.variant-b,.variant-c{grid-template-columns:1fr}.switcher{bottom:8px}.switcher .label{min-width:135px}.nav{display:none}.choice-grid{grid-template-columns:1fr}}
  </style>

<body>
<div id="root">
  <div style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#eef2f8;background:#090b10;font-family:system-ui,sans-serif">
    <div style="max-width:520px;text-align:center">
      <div style="font-size:20px;font-weight:700;margin-bottom:10px">Wemux Lite</div>
      <div style="color:#8992a4;line-height:1.7">正在加载界面… 如果此提示持续显示，请确认浏览器已启用 JavaScript，然后强制刷新页面。</div>
    </div>
  </div>
</div>
<script>
window.onerror=function(message,source,line,column,error){
  var root=document.getElementById('root');
  var detail=String(message||error||'Unknown browser error');
  if(root){root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;color:#eef2f8;background:#090b10;font-family:system-ui,sans-serif"><div style="max-width:620px"><div style="font-size:20px;font-weight:700;color:#f07178;margin-bottom:10px">页面脚本加载失败</div><div style="color:#aeb7c6;line-height:1.7;margin-bottom:12px">请强制刷新页面；如果仍然失败，请把下面的错误发给开发者。</div><pre style="white-space:pre-wrap;word-break:break-word;background:#151923;border:1px solid #252b38;border-radius:6px;padding:12px;color:#eef2f8">'+detail.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre></div></div>'}
  try{fetch('/api/client-error',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:detail,source:source,line:line,column:column,userAgent:navigator.userAgent})})}catch(ignore){}
};
</script>
<script>
const projects=[{name:'wemux-lite',meta:'3 个会话 · 2 个工作节点',active:true},{name:'payments-api',meta:'2 个会话 · 1 个工作节点'},{name:'design-system',meta:'1 个会话 · 1 个工作节点'}]
const sessions=[{name:'实现服务端/工作节点协议',meta:'Codex · 笔记本',state:'on'},{name:'调研模型发现',meta:'Claude Code · 笔记本',state:'busy'},{name:'修复 Linux 构建',meta:'Codex · Linux 开发机',state:'on'},{name:'整理自述文档结构',meta:'Pi · Linux 开发机',state:''}]
const workers=[{name:'笔记本',host:'macOS · ARM64',path:'/Users/chen/code/wemux-lite',state:'在线',runtimes:[['Codex','0.116.0','就绪',['gpt-5.4','gpt-5.3-codex']],['Claude Code','2.1.76','就绪',['sonnet','opus']]]},{name:'Linux 开发机',host:'Ubuntu 24.04 · x64',path:'/srv/code/wemux-lite',state:'在线',runtimes:[['Codex','0.116.0','就绪',['gpt-5.4']],['Pi','0.70.6','已配置',['openai/gpt-5.4','anthropic/sonnet']]]}]
let modalOpen=false,turnRunning=true,showUnknown=false;
function renderTopbar(){return `<div class="topbar"><div class="brand"><span class="logo">W</span> Wemux Lite <span class="proto">界面原型</span></div><div class="nav"><button class="active">项目</button><button>工作节点</button><button>模型</button></div><div class="top-spacer"></div><input class="search" placeholder="搜索项目和会话…"><button class="ghost">⌘ K</button><div class="avatar">用户</div></div>`}
function projectList(withSessions=true){return `<aside class="left"><div class="head"><strong>项目</strong><div class="spacer"></div><button class="iconbtn">＋</button></div><div class="scroll"><div class="section-label">工作空间</div>${projects.map(p=>`<div class="item ${p.active?'active':''}"><span>◇</span><div class="item-main"><div class="item-title">${p.name}</div><div class="item-meta">${p.meta}</div></div></div>`).join('')}<div class="project-tools"><button class="ghost" style="border:1px solid var(--line)">概览</button><button class="ghost" style="border:1px solid var(--line)">执行位置 2</button></div>${withSessions?`<div class="section-label">wemux-lite · 跨节点会话</div><button class="primary" id="newSession" style="width:calc(100% - 14px);margin:0 7px 8px">＋ 新建会话</button>${sessions.map((s,i)=>`<div class="item ${i===0?'active':''}"><span class="dot ${s.state}"></span><div class="item-main"><div class="item-title">${s.name}</div><div class="item-meta">${s.meta}</div></div></div>`).join('')}`:''}<div class="section-label">项目执行位置</div><div class="binding"><div class="binding-top"><span class="dot on"></span><b>笔记本</b><span class="spacer"></span><span class="pill green">可用</span></div><div class="path">/Users/chen/code/wemux-lite</div></div><div class="binding"><div class="binding-top"><span class="dot on"></span><b>Linux 开发机</b><span class="spacer"></span><span class="pill green">可用</span></div><div class="path">/srv/code/wemux-lite</div></div></div></aside>`}
function chat(compact=false){const status=showUnknown?'<span class="pill yellow">● 结果未知</span>':turnRunning?'<span class="pill green">● 运行中</span>':'<span class="pill">已取消</span>';return `<main class="center chat"><div class="chat-head"><div><div class="chat-title">实现服务端/工作节点协议</div><div class="chat-meta">wemux-lite / 笔记本 / Codex / gpt-5.4</div></div><div class="spacer"></div>${status}<button class="iconbtn">⋯</button></div>${showUnknown?'<div class="banner"><b>工作节点连接中断</b><span>当前任务结果未知，等待笔记本重新连接并回报最终状态。</span></div>':''}<div class="messages"><div class="message user"><div class="bubble">先实现工作节点注册、心跳和断线重连，不要引入额外中间件。</div></div><div class="message"><div class="agent-icon">C</div><div class="bubble agent-text"><p>我会先建立共享协议和最小状态模型，然后实现工作节点主动连接服务端。</p><div class="tool">✓ 已读取 <code>docs/research/wemux-slim-and-mini-design.md</code></div><div class="tool">↻ 正在写入 <code>src/shared/protocol.ts</code></div><p>协议包含 <b>注册</b>、<b>心跳</b>、<b>命令</b>、<b>事件</b> 和 <b>确认</b>。身份来自连接令牌，不信任消息体中的工作节点 ID。</p></div></div></div><div class="composer-wrap"><div class="composer"><textarea placeholder="向 Codex 发送消息…" ${showUnknown?'disabled':''}></textarea><div class="compose-row"><button class="iconbtn">＋</button><div class="locked-runtime"><span>固定会话：</span><b>Codex</b><span>·</span><b>gpt-5.4</b><span>·</span><b>笔记本</b></div><span class="pill">可写工作区</span>${turnRunning?'<button class="danger" id="cancelTurn">■ 停止</button>':'<button class="send">发送 ↑</button>'}</div></div></div></main>`}
function details(){return `<aside class="right"><div class="head"><strong>会话上下文</strong></div><div class="scroll detail"><div class="card"><h3>固定执行环境</h3><div class="kv"><span>工作节点</span><b><span class="dot ${showUnknown?'':'on'}" style="display:inline-block;margin-right:6px"></span>笔记本</b><span>智能体</span><b>Codex 0.116.0</b><span>模型</span><b>gpt-5.4</b><span>权限</span><b>可写工作区</b></div><div class="item-meta">创建后不可切换；如需其他智能体或模型，请新建会话。</div></div><div class="card"><h3>项目路径绑定</h3><div class="path">/Users/chen/code/wemux-lite</div><div class="item-meta" style="margin-top:8px">此会话固定在笔记本上，不会自动迁移。</div></div><div class="card"><h3>智能体原生会话</h3><div class="stat"><span>原生 ID</span><span>thr_a82…</span></div><div class="stat"><span>恢复能力</span><span class="pill green">支持恢复</span></div><div class="stat"><span>对话轮数</span><span>4</span></div><div class="stat"><span>启动时间</span><span>11 分钟前</span></div></div><div class="card"><h3>工作节点连接</h3><div class="stat"><span>连接状态</span><span style="color:${showUnknown?'var(--yellow)':'var(--green)'}">${showUnknown?'重新连接中':'在线'}</span></div><div class="stat"><span>活动任务</span><span>1 / 1</span></div><div class="stat"><span>最近心跳</span><button class="ghost" id="toggleUnknown" style="padding:2px 4px">${showUnknown?'38 秒前':'8 秒前'}</button></div></div></div></aside>`}
function A(){return `<div class="layout variant-a">${projectList(true)}${chat()}${details()}</div>`}
function B(){return `<div class="layout variant-b">${projectList(false)}<section class="center"><div class="hero-chat"><div class="session-strip">${sessions.map((s,i)=>`<button class="session-chip ${i===0?'active':''}">${s.name} · ${s.meta}</button>`).join('')}<button class="session-chip">＋ 新建对话</button></div>${chat()}</div></section></div>`}
function runtimeCard(r){return `<div class="runtime"><div class="runtime-row"><span class="dot on"></span><b>${r[0]}</b><span class="pill">v${r[1]}</span><div class="spacer"></div><span class="pill green">${r[2]}</span></div><div class="models">${r[3].map(m=>`<span class="mini-model">${m}</span>`).join('')}</div></div>`}
function C(){return `<div class="layout variant-c">${projectList(false)}<main class="node-main"><div class="node-toolbar"><div><h2>工作节点与智能体清单</h2><div class="item-meta">管理已注册的机器、智能体运行时和本地模型</div></div><div class="spacer"></div><button class="ghost">全部刷新</button><button class="primary">＋ 注册工作节点</button></div><div class="worker-grid">${workers.map(w=>`<div class="worker"><div class="worker-top"><span class="dot on"></span><div><b>${w.name}</b><div class="item-meta">${w.host}</div></div><div class="spacer"></div><span class="pill green">${w.state}</span><button class="iconbtn">⋯</button></div><div class="worker-body"><div class="path">${w.path}</div><div class="section-label" style="padding-left:0">已检测的智能体</div>${w.runtimes.map(runtimeCard).join('')}<button class="ghost" style="width:100%;border:1px solid var(--line)">重新检测</button></div></div>`).join('')}<div class="worker"><div class="worker-top"><span class="dot"></span><div><b>工作室电脑</b><div class="item-meta">Windows · x64</div></div><div class="spacer"></div><span class="pill">离线 · 2 小时</span></div><div class="worker-body"><div class="item-meta">会话仍然可见；工作节点重新连接前，无法发起新的对话轮次。</div></div></div></div></main></div>`}
const variants={A:['项目优先工作台',A],B:['对话优先控制台',B],C:['工作节点与智能体管理',C]};let key=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();if(!variants[key])key='A';
function setVariant(next){key=next;const u=new URL(location.href);u.searchParams.set('variant',key);history.replaceState({},'',u);render()}
function cycle(n){const ks=Object.keys(variants),i=ks.indexOf(key);setVariant(ks[(i+n+ks.length)%ks.length])}
function render(){document.getElementById('root').innerHTML=`<div class="app">${renderTopbar()}<div class="view">${variants[key][1]()}</div></div><div class="switcher"><button id="prev">←</button><div class="label">方案 ${key} — ${variants[key][0]}</div><button id="next">→</button></div><div class="note">抛弃式界面原型 · 使用 ← → 切换方案</div>`;document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1)}
addEventListener('keydown',e=>{const active=document.activeElement;if(active&&(['INPUT','TEXTAREA','SELECT'].includes(active.tagName)||active.isContentEditable))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script>
</body>
</html>
