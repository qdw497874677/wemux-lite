<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b10" />
    <title>Wemux Lite</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 。
      window.__wemuxModuleLoadFailed = function () {
        window.__wemuxModuleLoadDidFail = true
        window.setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.firstElementChild) {
            var bar = document.createElement('div')
            bar.textContent = '：。'
            bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:12px 16px;background:#7f1d1d;color:#fff;font:14px/1.5 system-ui,sans-serif;text-align:center'
            root.appendChild(bar)
          }
        }, 0)
      }
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__wemuxModuleLoadFailed()"></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root')
        if (root && !root.firstElementChild && !window.__wemuxModuleLoadDidFail) {
          var bar = document.createElement('div')
          bar.textContent = '。 JavaScript 。'
          bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:12px 16px;background:#7f1d1d;color:#fff;font:14px/1.5 system-ui,sans-serif;text-align:center'
          root.appendChild(bar)
        }
      }, 15000)
    </script>
  </body>
</html>
